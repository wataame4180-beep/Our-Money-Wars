<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バトル調整卓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9ECEE; --paper2:#F6F8F9; --grid:#D2DAE0; --grid2:#C0CBD4;
  --ink:#16202A; --ink-soft:#5A6975; --line:#AEBAC4;
  --p1:#BE2038; --p2:#14618F; --gold:#9A7400; --ok:#2F6B3C;
  --shadow:rgba(22,32,42,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#141A20; --paper2:#1B232B; --grid:#232E37; --grid2:#2C3945;
    --ink:#E4EAEF; --ink-soft:#93A2AE; --line:#3A4854;
    --p1:#F0647A; --p2:#5FB4E6; --gold:#D8B23F; --ok:#6FC086;
    --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#141A20; --paper2:#1B232B; --grid:#232E37; --grid2:#2C3945;
  --ink:#E4EAEF; --ink-soft:#93A2AE; --line:#3A4854;
  --p1:#F0647A; --p2:#5FB4E6; --gold:#D8B23F; --ok:#6FC086;
  --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  color:var(--ink); background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid2) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid2) 1px, transparent 1px);
  background-size:20px 20px,20px 20px,100px 100px,100px 100px;
  line-height:1.6; font-size:15px;
}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:16px 14px 64px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}

.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.top h1{font-size:19px}
.top .code{font-size:13px;color:var(--ink-soft)}
.top .code b{color:var(--ink);letter-spacing:.18em}
.spacer{flex:1}

.track{display:flex;gap:5px;align-items:center}
.track i{width:17px;height:17px;border:1.5px solid var(--line);border-radius:3px;
  display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;background:var(--paper2)}
.track i.now{border-color:var(--ink);border-width:2px}
.track i.w1{background:var(--p1);border-color:var(--p1);color:var(--paper2)}
.track i.w2{background:var(--p2);border-color:var(--p2);color:var(--paper2)}
.track i.dr{background:var(--line);border-color:var(--line);color:var(--paper2)}

.connDot{width:10px;height:10px;border-radius:50%;background:var(--p1);display:inline-block;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--p1) 20%, transparent)}
.skipBox{display:flex;align-items:center;gap:6px}
.skipSq{width:15px;height:15px;border:1.5px solid var(--line);border-radius:3px;background:var(--paper2);display:inline-block}
.skipSq.on{background:var(--ok);border-color:var(--ok)}
.endNote{font-size:12px;color:var(--p1)}

.panel{background:var(--paper2);border:1.5px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;
  box-shadow:0 1px 0 var(--shadow)}
.panel > h2{font-size:15px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel > h2 small{font-weight:400;font-size:12px;color:var(--ink-soft)}

.btn{background:var(--ink);color:var(--paper2);border:none;border-radius:5px;
  padding:10px 18px;font-weight:700;letter-spacing:.03em}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:focus-visible,.skill:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft);font-size:13px}

.lobby{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.lobby{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field label{font-size:12px;color:var(--ink-soft);font-weight:500}
.field input,.field select{background:var(--paper);border:1.5px solid var(--line);border-radius:4px;padding:7px 9px}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.codebox{font-size:30px;font-weight:900;letter-spacing:.24em;padding:10px 0}

.wallet{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.wallet .big{font-size:30px;font-weight:900;color:var(--gold)}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:2px 11px;font-size:12px}
.chip.warn{border-color:var(--p1);color:var(--p1);font-weight:700}

.stats{display:grid;gap:8px}
.stat{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;
  border-bottom:1px dashed var(--line);padding-bottom:8px}
.stat .nm{font-weight:700;font-size:13px;color:var(--ink-soft)}
.stat .val{font-size:16px;font-weight:700}
.stat .val em{font-style:normal;color:var(--ok);font-weight:700;font-size:13px}
.stat .sub{font-size:11px;color:var(--ink-soft);margin-top:2px}
.steps{display:flex;gap:4px}
.step{border:1.5px solid var(--line);background:var(--paper);border-radius:4px;
  padding:5px 8px;font-size:12px;font-weight:700;min-width:42px}
.step:disabled{opacity:.3;cursor:not-allowed}

.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:720px){.shop{grid-template-columns:1fr}}
.skill{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:5px;padding:11px 12px;
  display:flex;flex-direction:column;gap:5px}
.skill.on{border-color:var(--ok);border-width:2.5px;background:color-mix(in srgb,var(--ok) 9%,var(--paper))}
.skill:disabled{opacity:.4;cursor:not-allowed}
.skill .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.skill .nm{font-weight:700}
.skill .cost{font-size:13px;font-weight:700;color:var(--gold)}
.skill .d{font-size:12px;color:var(--ink-soft);line-height:1.45}
.tag{font-size:10px;font-weight:700;border:1px solid var(--line);border-radius:3px;padding:0 5px;align-self:flex-start}
.tag.act{border-color:var(--gold);color:var(--gold)}
.tag.timed{border-color:var(--p2);color:var(--p2)}
.tag.econ{border-color:var(--ok);color:var(--ok)}

.field2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.field2{grid-template-columns:1fr}}
.fighter{border:1.5px solid var(--line);border-radius:6px;padding:12px;background:var(--paper2)}
.fighter.me{border-color:var(--ink);border-width:2.5px}
.fighter .who{font-weight:900;font-size:14px;margin-bottom:6px}
.p1c{color:var(--p1)} .p2c{color:var(--p2)}
.hpbarWrap{position:relative}
.hpbar{height:16px;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;background:var(--paper)}
.hpFx{position:absolute;right:4px;top:50%;width:0;height:0;pointer-events:none;z-index:4}
.hpFxIcon{position:absolute;left:0;top:0;font-size:22px;line-height:1;
  transform:translate(-50%,-50%) scale(.4);opacity:0;
  animation:hpFxPop 1.1s cubic-bezier(.2,.8,.3,1) forwards;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
@keyframes hpFxPop{
  0%{ transform:translate(-50%,-50%) scale(.4); opacity:0; }
  18%{ transform:translate(-50%,-150%) scale(1.5); opacity:1; }
  70%{ transform:translate(-50%,-180%) scale(1.15); opacity:1; }
  100%{ transform:translate(-50%,-230%) scale(1); opacity:0; }
}
@media (prefers-reduced-motion: reduce){ .hpFxIcon{animation:none;opacity:0} }
.hpbar div{height:100%;transition:width .35s ease}
.hpnum{font-size:13px;margin-top:4px;font-weight:700}
.miniStats{display:flex;gap:12px;font-size:12px;color:var(--ink-soft);margin-top:6px;flex-wrap:wrap}
.badge{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--ink-soft)}
.skillInfo{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.skillInfoRow{display:flex;flex-direction:column;gap:2px}
.skillInfoD{font-size:11px;color:var(--ink-soft);line-height:1.4}

.log{max-height:280px;overflow-y:auto;border:1.5px solid var(--line);border-radius:5px;
  background:var(--paper);padding:10px 12px;font-size:13px}
.log p{margin:0 0 4px}
.log p.fresh{animation:logPop .6s ease}
@keyframes logPop{
  0%{background:color-mix(in srgb, var(--gold) 35%, transparent); border-radius:3px; padding-left:4px}
  100%{background:transparent; padding-left:0}
}
.log .t{font-weight:900;color:var(--ink-soft);font-size:11px;margin-top:9px;border-top:1px dashed var(--line);padding-top:6px}
.log .d1{color:var(--p1)} .log .d2{color:var(--p2)}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:220px;text-align:left}
.actName{font-weight:700}
.actD{font-size:11px;font-weight:400;opacity:.8;line-height:1.4;white-space:normal}
.tradeBox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.result{text-align:center;padding:20px 0}
.result .big{font-size:34px;font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper2);padding:10px 18px;border-radius:5px;font-size:13px;z-index:9;
  box-shadow:0 4px 14px var(--shadow)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.helpOverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;
  padding-top:calc(24px + env(safe-area-inset-top,0px));overflow-y:auto}
.helpOverlay.hidden{display:none}
.helpModal{background:var(--paper2);border:1.5px solid var(--line);border-radius:8px;
  max-width:780px;width:100%;padding:18px;box-shadow:0 8px 28px var(--shadow)}
.helpHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.helpHead h2{font-size:17px}
.helpBody h3{font-size:13px;color:var(--ink-soft);margin:0 0 8px;letter-spacing:.03em}
.helpBody .rules{margin:0 0 18px;padding-left:18px;font-size:13px;line-height:1.8}
.helpBody .rules li{margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>バトル調整卓</h1>
    <span class="code" id="codeLabel"></span>
    <span class="spacer"></span>
    <span id="connDot" class="connDot" title="接続状態" style="display:none"></span>
    <div class="skipBox" id="endBox"></div>
    <div class="skipBox" id="skipBox"></div>
    <button class="btn ghost sm" id="helpBtn" title="遊び方・スキル一覧">？</button>
    <div class="track" id="track"></div>
  </div>
  <div id="stage"><div class="panel"><p class="muted">読み込み中…</p></div></div>
</div>

<div id="helpOverlay" class="helpOverlay hidden">
  <div class="helpModal">
    <div class="helpHead">
      <h2>遊び方・スキル一覧</h2>
      <button class="btn ghost sm" id="helpClose">閉じる</button>
    </div>
    <div class="helpBody" id="helpBody"></div>
  </div>
</div>

<!--

<script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-database-compat.js"></script>

<script>

   Firebaseコンソール > プロジェクトの設定 > 全般 > マイアプリ(Webアプリ)

const FIREBASE_CONFIG = {

  databaseURL: "https://our-money-wars-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "our-money-wars",
  storageBucket: "our-money-wars.firebasestorage.app",
  messagingSenderId: "56083801995",
  appId: "1:56083801995:web:70db18a7eb6b2af139718e",
  measurementId: "G-V6K2C0VRS3"
};

<script>
/* ============ スキル定義 ============
   cat: 'buff'   常時発動(所持しているだけで効く)
        'active' 戦闘中に自分でターンを選んで使う(1戦闘1回)
        'timed'  指定ターン終了時に自動発動(1戦闘1回)
        'econ'   戦闘とは無関係にptだけ動く(1回)          */
const SKILLS = {
  sleep:    {name:"睡眠",     icon:"💤", cost:500,  cat:'active', d:"使用すると次のターンは行動できなくなる代わりに、最大HPが5%増える(この増加分は以降全ラウンドに持ち越される)"},
  dot:      {name:"持続攻撃", icon:"☠️", cost:1500, cat:'active', d:"相手に500ダメージを、3ターンの間毎ターン与え続ける"},
  pierce:   {name:"貫通攻撃", icon:"🏹", cost:1450, cat:'active', d:"攻撃力の5倍の固定ダメージを与える。相手のスキルの効果を一切受けない"},
  insurance:{name:"傷害保険", icon:"🩹", cost:350,  cat:'buff',   d:"所持しているラウンドの間、ダメージを受けるたびに(受けたダメージ×0.5)ptを獲得する(端数切り捨て)"},
  econSkill:{name:"ス〇ーピース保険", icon:"💰", cost:350, cat:'econ', d:"購入した次のラウンド開始時に600ptを獲得する"},
  drGuard:  {name:"被ダメ軽減", icon:"🧱", cost:300, cat:'active', d:"使用したターンから3ターンの間、受けるダメージを10%軽減する"},
  reflect:  {name:"反射",     icon:"🪞", cost:400,  cat:'active', d:"使用後、次に受けるダメージの30%を相手に返す(それで相手が死ぬことはない)"},
  comboAtk: {name:"攻撃スキル", icon:"⚔️", cost:400, cat:'active', d:"次の通常攻撃が、本来のダメージの30%分を与える5連撃になる"},
  autoheal5:{name:"回復スキル", icon:"✨", cost:300, cat:'timed', turn:5, d:"5ターン後に自動で発動。最大HPの20%を即時回復する"},
  regenB:   {name:"回復スキル", icon:"💚", cost:400, cat:'active', d:"使用した次のターン開始時、直前のターンに受けたダメージの40%(端数切り捨て)を回復する。使用者が戦闘不能なら無効"},
  trade:    {name:"交換",     icon:"🔄", cost:650,  cat:'active', d:"自分か相手を選び、そのステータス(HP・攻撃力・防御力・速度)から2つを選んで、その値を2ターンの間入れ替える"},
  evade:    {name:"回避",     icon:"💨", cost:400,  cat:'buff',   d:"速度が200以上のとき、相手の通常攻撃を1度だけ無効化する"},
  purge:    {name:"パージ",   icon:"🔥", cost:500,  cat:'active', d:"HPを10%消費し、速度を20%上げる(3ターン継続)"},
  castOn:   {name:"キャストオン", icon:"🪄", cost:300, cat:'active', d:"速度を10%下げて防御力を10%上げる(3ターン継続)"},
  soulStrike:{name:"魂魄理念", icon:"👻", cost:600, cat:'buff', d:"購入すると『魂の打撃』を付与し、通常攻撃が最大HPの5%ダメージになる(永続)。付与中にもう一度購入すると解除し、通常攻撃を攻撃力ベースの通常ダメージに戻す(解除時も購入費用はかかる)"},
  cuteGaze: {name:"かわいいまなざし", icon:"😻", cost:550, cat:'active', d:"使用すると相手の攻撃力を30%下げる(3ターン継続)"},
};
const SKILL_IDS = Object.keys(SKILLS);
const STAT_LABEL = {hp:'HP', atk:'攻撃力', def:'防御力', spd:'速度'};
/* ロールごとの基礎ステータス倍率(仮数値)。基礎値(部屋設定)に掛けて使う。
   それぞれ1つのステータスに特化する代わりに、残り3つが低めになる。 */
const ROLES = {
  hp:  {name:'HP特化',   icon:'❤️', desc:'HPに特化。攻撃・防御・速度は低め', mult:{hp:1.2, atk:0.8, def:0.8, spd:0.8}},
  atk: {name:'攻撃力特化', icon:'⚔️', desc:'攻撃力に特化。HP・防御・速度は低め', mult:{hp:0.8, atk:1.2, def:0.8, spd:0.8}},
  def: {name:'防御力特化', icon:'🛡️', desc:'防御力に特化。HP・攻撃・速度は低め', mult:{hp:0.8, atk:0.8, def:1.2, spd:0.8}},
  spd: {name:'速度特化',   icon:'💨', desc:'速度に特化。HP・攻撃・防御は低め', mult:{hp:0.8, atk:0.8, def:0.8, spd:1.2}},
};
const ROLE_IDS = Object.keys(ROLES);

const DEFAULT_CFG = {
  rounds:7, startPt:1000, winPt:800, losePt:1000, ptLife:2,
  startCoin:1000, coinPerRound:1000, coinLife:2, coinTierSize:100,
  hpPerCoin:10, atkPerCoin:1, defPerCoin:1, spdPerCoin:1,
  baseHp:30000, baseAtk:2000, baseDef:500, baseSpd:120, useRoles:true,
  formula:"ratio", minDmg:1, maxTurns:30, dblThr:2, rerollBase:100,
  resetEachRound:true, resetStatsEachRound:true
};

/* ============ ユーティリティ ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shopFor(code,round,player,reroll){
  const r=rng(hashStr(`${code}|${round}|${player}|${reroll}`));
  const pool=SKILL_IDS.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  return pool.slice(0,3);
}
function tagFor(k, cfg){
  const s=SKILLS[k];
  if(s.cat==='buff') return '常時';
  if(s.cat==='active') return '使用';
  if(s.cat==='timed') return `${paramOf(k,'turn',cfg)}T後 自動`;
  return '次R開始時';
}
function tagClsFor(s){
  if(s.cat==='active') return 'act';
  if(s.cat==='timed') return 'timed';
  if(s.cat==='econ') return 'econ';
  return '';
}
function costOf(k, cfg){
  cfg = cfg || (typeof S!=='undefined' && S ? S.cfg : null);
  if(cfg && cfg.skillCosts && cfg.skillCosts[k]!=null) return cfg.skillCosts[k];
  return SKILLS[k].cost;
}
const PARAM_DEFS = {
  sleep:    [{key:'hpPct',  label:'最大HP増加(%)',        default:5}],
  dot:      [{key:'dmg',    label:'1ターンあたりダメージ', default:500},{key:'turns',label:'継続ターン数',default:3}],
  pierce:   [{key:'mult',   label:'攻撃力の倍率',          default:5}],
  insurance:[{key:'rate',   label:'被ダメに対する獲得率(%)',default:50}],
  econSkill:[{key:'bonus',  label:'次R開始時ボーナスpt',    default:600}],
  drGuard:  [{key:'pct',    label:'軽減率(%)',             default:10},{key:'turns',label:'継続ターン数',default:3}],
  reflect:  [{key:'pct',    label:'反射率(%)',             default:30}],
  comboAtk: [{key:'hits',   label:'連撃回数',              default:5},{key:'pct',label:'1発あたりの威力(%)',default:30}],
  autoheal5:[{key:'pct',    label:'回復量(%)',             default:20},{key:'turn',label:'発動ターン',default:5}],
  regenB:   [{key:'pct',    label:'回復率(%)',             default:40}],
  evade:    [{key:'spdThreshold',label:'必要速度',         default:140}],
  trade:    [{key:'turns',label:'継続ターン数',default:2}],
  purge:    [{key:'hpPct',label:'消費HP(%)',default:10},{key:'spdPct',label:'速度上昇(%)',default:20},{key:'turns',label:'継続ターン数',default:3}],
  castOn:   [{key:'spdPct',label:'速度低下(%)',default:10},{key:'defPct',label:'防御上昇(%)',default:10},{key:'turns',label:'継続ターン数',default:3}],
  soulStrike:[{key:'hpPct',label:'通常攻撃ダメージ(最大HPの%)',default:5}],
  cuteGaze: [{key:'atkPct',label:'攻撃力低下(%)',default:30},{key:'turns',label:'継続ターン数',default:3}],
};
function paramOf(skillId, key, cfg){
  cfg = cfg || (typeof S!=='undefined' && S ? S.cfg : null);
  const v = cfg && cfg.skillParams && cfg.skillParams[skillId] ? cfg.skillParams[skillId][key] : null;
  if(v!=null) return v;
  const def = PARAM_DEFS[skillId] && PARAM_DEFS[skillId].find(p=>p.key===key);
  return def ? def.default : 0;
}
function descFor(k, cfg){
  cfg = cfg || (typeof S!=='undefined' && S ? S.cfg : null);
  const p = key => paramOf(k,key,cfg);
  switch(k){
    case 'sleep': return `使用すると次のターンは行動できなくなる代わりに、最大HPが${p('hpPct')}%増える(この増加分は以降全ラウンドに持ち越される)`;
    case 'dot': return `相手に${p('dmg')}ダメージを、${p('turns')}ターンの間毎ターン与え続ける`;
    case 'pierce': return `攻撃力の${p('mult')}倍の固定ダメージを与える。相手のスキルの効果を一切受けない`;
    case 'insurance': return `所持しているラウンドの間、ダメージを受けるたびに受けたダメージの${p('rate')}%をptとして獲得する(端数切り捨て)`;
    case 'econSkill': return `購入した次のラウンド開始時に${p('bonus')}ptを獲得する`;
    case 'drGuard': return `使用したターンから${p('turns')}ターンの間、受けるダメージを${p('pct')}%軽減する`;
    case 'reflect': return `使用後、次に受けるダメージの${p('pct')}%を相手に返す(それで相手が死ぬことはない)`;
    case 'comboAtk': return `次の通常攻撃が、本来のダメージの${p('pct')}%分を与える${p('hits')}連撃になる`;
    case 'autoheal5': return `${p('turn')}ターン後に自動で発動。最大HPの${p('pct')}%を即時回復する`;
    case 'regenB': return `使用した次のターン開始時、直前のターンに受けたダメージの${p('pct')}%(端数切り捨て)を回復する。使用者が戦闘不能なら無効`;
    case 'trade': return `自分か相手、どちらか選んだプレイヤーのステータス(HP・攻撃力・防御力・速度)から2つを選び、その値を${p('turns')}ターンの間入れ替える`;
    case 'evade': return `速度が${p('spdThreshold')}以上のとき、相手の通常攻撃を1度だけ無効化する`;
    case 'purge': return `使用するとHPの${p('hpPct')}%を消費し、速度が${p('spdPct')}%上昇する(${p('turns')}ターン継続)`;
    case 'castOn': return `使用すると速度が${p('spdPct')}%低下し、防御力が${p('defPct')}%上昇する(${p('turns')}ターン継続)`;
    case 'soulStrike': return `購入すると『魂の打撃』を付与し、通常攻撃が最大HPの${p('hpPct')}%ダメージになる(永続)。付与中にもう一度購入すると解除し、通常攻撃を元(攻撃力ベース)に戻す(解除時も購入費用はかかる)`;
    case 'cuteGaze': return `使用すると相手の攻撃力を${p('atkPct')}%下げる(${p('turns')}ターン継続)`;
  }
  return SKILLS[k].d;
}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3200);
}

/* ============ ステータス購入の階段式コスト ============
   coinTierSize単位ごとに1コイン/ユニットずつ単価が上がる。
   買った量の「合計」から毎回計算し直す純粋関数にすることで、
   プレビュー表示と実際の課金を常に同じ値に保つ。 */
function coinCostFor(units, cfg){
  const tierSize = (cfg&&cfg.coinTierSize) || 100;
  units = Math.max(0, units|0);
  let cost=0, pos=0, remaining=units;
  while(remaining>0){
    const tier = Math.floor(pos/tierSize);
    const price = tier+1;
    const roomInTier = tierSize - (pos % tierSize);
    const take = Math.min(remaining, roomInTier);
    cost += take*price;
    remaining -= take; pos += take;
  }
  return cost;
}

/* ============ 所持pt(先入れ先出し + 有効期限) ============ */
function walletTotal(w){return (w||[]).reduce((s,e)=>s+e.amt,0)}
function walletSpend(w,amt){
  const out=(w||[]).map(e=>({...e}));
  let left=amt;
  for(const e of out){ if(left<=0)break; const t=Math.min(e.amt,left); e.amt-=t; left-=t; }
  return out.filter(e=>e.amt>0);
}
function walletExpire(w,round,life){ return (w||[]).filter(e=>round - e.round < life); }

/* ============ 戦闘エンジン(ホストのみ実行) ============ */
function mkFighter(load,cfg,nm,extraMaxHp,hasSoulStrike,roleMult){
  const sk=load.skills||[];
  extraMaxHp = extraMaxHp||0;
  roleMult = roleMult || {hp:1,atk:1,def:1,spd:1};
  const bHp=load.hp||0, bAtk=load.atk||0, bDef=load.def||0, bSpd=load.spd||0;
  const rHp=Math.round(cfg.baseHp*roleMult.hp), rAtk=Math.round(cfg.baseAtk*roleMult.atk),
        rDef=Math.round(cfg.baseDef*roleMult.def), rSpd=Math.round(cfg.baseSpd*roleMult.spd);
  return {
    nm, maxHp:rHp+extraMaxHp+bHp, hp:rHp+extraMaxHp+bHp,
    atk:rAtk+bAtk, def:rDef+bDef, spd:rSpd+bSpd,
    skills:sk, used:{}, fired:{}, sleepBonusEarned:0,
    hasSoulStrike: !!hasSoulStrike,
    soulStrikePct: paramOf('soulStrike','hpPct',cfg)/100,
    dmgTakenThisTurn:0, dmgTakenLastTurn:0,
    sleepSkip:false, pendingRegen:null, reflectArmed:false, nextAttackMulti:null,
    tempDRTurns:0, dots:[], dodgeUsed:false, statBuffs:[],
    hasEvasion: sk.includes('evade'),
    insurance: sk.includes('insurance'), insuranceGain:0,
    tradeApplied:null,
    /* 部屋設定から解決した、このスキルセットにおける効果値 */
    sleepHpPct:   paramOf('sleep','hpPct',cfg)/100,
    dotDmg:       paramOf('dot','dmg',cfg),
    dotTurns:     paramOf('dot','turns',cfg),
    pierceMult:   paramOf('pierce','mult',cfg),
    insuranceRate:paramOf('insurance','rate',cfg)/100,
    tempDRPct:    paramOf('drGuard','pct',cfg)/100,
    drGuardTurns: paramOf('drGuard','turns',cfg),
    reflectPct:   paramOf('reflect','pct',cfg)/100,
    comboHits:    paramOf('comboAtk','hits',cfg),
    comboPct:     paramOf('comboAtk','pct',cfg)/100,
    autohealPct:  paramOf('autoheal5','pct',cfg)/100,
    autohealTurn: paramOf('autoheal5','turn',cfg),
    regenPct:     paramOf('regenB','pct',cfg)/100,
    evadeThreshold:paramOf('evade','spdThreshold',cfg),
    tradeTurns:   paramOf('trade','turns',cfg),
    cuteGazeAtkPct: paramOf('cuteGaze','atkPct',cfg)/100,
    cuteGazeTurns:  paramOf('cuteGaze','turns',cfg),
    purgeHpPct:   paramOf('purge','hpPct',cfg)/100,
    purgeSpdPct:  paramOf('purge','spdPct',cfg)/100,
    purgeTurns:   paramOf('purge','turns',cfg),
    castOnSpdPct: paramOf('castOn','spdPct',cfg)/100,
    castOnDefPct: paramOf('castOn','defPct',cfg)/100,
    castOnTurns:  paramOf('castOn','turns',cfg),
  };
}
function rawDmg(atk,def,cfg){
  if(cfg.formula==='sub') return Math.max(cfg.minDmg, atk-def);
  return Math.max(cfg.minDmg, atk*atk/(atk+def));
}
function dealDamage(target, dmg, attacker, opts){
  opts = opts||{};
  let final = Math.max(0, dmg);
  if(!opts.bypassDefenderSkills && target.tempDRTurns>0) final = Math.round(final*(1-target.tempDRPct));
  final = Math.max(0, Math.round(final));
  target.hp = Math.max(0, target.hp-final);
  target.dmgTakenThisTurn += final;
  let insGain=0, reflectAmt=0;
  if(!opts.bypassDefenderSkills && target.insurance && final>0) insGain = Math.floor(final*target.insuranceRate);
  if(!opts.bypassDefenderSkills && target.reflectArmed && final>0 && attacker){
    const rf=Math.floor(final*target.reflectPct);
    const cap=Math.max(0, attacker.hp-1);
    reflectAmt=Math.min(rf,cap);
    if(reflectAmt>0) attacker.hp-=reflectAmt;
    target.reflectArmed=false;
  }
  target.insuranceGain += insGain;
  return {final, insGain, reflectAmt};
}
function strike(A,D,cfg,mult,log,tagA,tagD,R,opts){
  opts = Object.assign({isNormal:false,bypassDefenderSkills:false,fixedDmg:null},opts||{});
  if(opts.isNormal && D.hasEvasion && !D.dodgeUsed && D.spd>=D.evadeThreshold){
    D.dodgeUsed=true;
    log.push({c:tagD,t:`${D.nm}が${A.nm}の攻撃を回避!`});
    return 0;
  }
  let raw = opts.fixedDmg!=null ? opts.fixedDmg : rawDmg(A.atk,D.def,cfg)*mult;
  raw = Math.max(1,Math.round(raw));
  const r = dealDamage(D, raw, A, {bypassDefenderSkills:opts.bypassDefenderSkills});
  log.push({c:tagA,t:`${A.nm}の攻撃 → ${r.final}ダメージ`});
  if(r.insGain>0) log.push({c:tagD,t:`傷害保険で${r.insGain}pt獲得`});
  if(r.reflectAmt>0) log.push({c:tagA,t:`反射で${r.reflectAmt}ダメージ`});
  return r.final;
}
function doAction(A,D,act,cfg,log,tagA,tagD,R){
  if(A.hp<=0) return;
  if(A.sleepSkip){ A.sleepSkip=false; log.push({c:tagA,t:`${A.nm}は眠っていて行動できない`}); return; }
  const actId = (act||'').includes(':') ? act.split(':')[0] : act;
  if(actId==='attack' || !SKILLS[actId]){
    const soulDmg = A.hasSoulStrike ? Math.round(A.maxHp*A.soulStrikePct) : null;
    if(A.nextAttackMulti){
      const {hits,pct}=A.nextAttackMulti; A.nextAttackMulti=null;
      log.push({c:tagA,t:`攻撃スキルの効果で${hits}連撃!`});
      for(let i=0;i<hits;i++){ if(D.hp<=0)break; strike(A,D,cfg,pct,log,tagA,tagD,R,{isNormal:true, fixedDmg: soulDmg!=null?Math.round(soulDmg*pct):null}); }
    } else {
      strike(A,D,cfg,1,log,tagA,tagD,R,{isNormal:true, fixedDmg: soulDmg});
    }
    return;
  }
  if(A.used[actId] || SKILLS[actId].cat!=='active' || !A.skills.includes(actId)){
    log.push({c:tagA,t:`${A.nm}は行動できなかった`}); return;
  }
  A.used[actId]=true;
  const s=SKILLS[actId];
  if(actId==='sleep'){
    A.sleepSkip=true;
    const inc=Math.round(A.maxHp*A.sleepHpPct);
    A.maxHp+=inc; A.hp=Math.min(A.maxHp,A.hp+inc);
    A.sleepBonusEarned=(A.sleepBonusEarned||0)+inc; /* 以降のラウンドにも永続で持ち越す分 */
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → 最大HPが${inc}増加(以降のラウンドにも持ち越されます)。次のターンは行動不能になる`});
  }
  else if(actId==='dot'){
    D.dots.push({dmg:A.dotDmg,turnsLeft:A.dotTurns,srcTag:tagA});
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → ${A.dotTurns}ターンの間、毎ターン${A.dotDmg}ダメージ`});
  }
  else if(actId==='pierce'){
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name}!`});
    strike(A,D,cfg,1,log,tagA,tagD,R,{fixedDmg:Math.round(A.atk*A.pierceMult), bypassDefenderSkills:true});
  }
  else if(actId==='drGuard'){
    A.tempDRTurns=A.drGuardTurns;
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → ${A.drGuardTurns}ターンの間、被ダメージ-${Math.round(A.tempDRPct*100)}%`});
  }
  else if(actId==='reflect'){
    A.reflectArmed=true;
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → 次に受けるダメージの${Math.round(A.reflectPct*100)}%を反射`});
  }
  else if(actId==='comboAtk'){
    A.nextAttackMulti={hits:A.comboHits,pct:A.comboPct};
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → 次の通常攻撃が${A.comboHits}連撃になる`});
  }
  else if(actId==='regenB'){
    A.pendingRegen = A.__turn+1;
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → 次のターン開始時に回復する`});
  }
  else if(actId==='trade'){
    const parts=(act||'').split(':');
    const k1=parts[1], k2=parts[2], targetRole=parts[3];
    /* targetRole: '1'=プレイヤー1, '2'=プレイヤー2。tagAが'd1'ならA=p1、そうでなければA=p2 */
    const meIsP1 = tagA==='d1';
    let target;
    if(targetRole==='1') target = meIsP1 ? A : D;
    else if(targetRole==='2') target = meIsP1 ? D : A;
    else target = D; /* 未指定時は従来通り相手を対象にする */
    if(STAT_LABEL[k1] && STAT_LABEL[k2] && k1!==k2 && target){
      const v1=target[k1], v2=target[k2];
      target[k1]=v2; target[k2]=v1;
      target.tradeApplied={turnsLeft:A.tradeTurns, keys:[k1,k2], values:[v1,v2]};
      const who = target===A ? '自分' : '相手';
      log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → ${who}の${STAT_LABEL[k1]}と${STAT_LABEL[k2]}を入れ替えた(${A.tradeTurns}ターン)`});
    } else {
      log.push({c:tagA,t:`${s.icon} ${s.name}は不正な指定のため発動しなかった`});
    }
  }
  else if(actId==='purge'){
    const hpCost=Math.round(A.maxHp*A.purgeHpPct);
    A.hp=Math.max(0,A.hp-hpCost);
    const spdBonus=Math.round(A.spd*A.purgeSpdPct);
    A.spd+=spdBonus;
    A.statBuffs.push({stat:'spd',delta:spdBonus,turnsLeft:A.purgeTurns});
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → HPを${hpCost}消費し、速度が${spdBonus}上昇(${A.purgeTurns}ターン)`});
  }
  else if(actId==='castOn'){
    const spdDrop=Math.round(A.spd*A.castOnSpdPct);
    const defBonus=Math.round(A.def*A.castOnDefPct);
    A.spd=Math.max(0,A.spd-spdDrop);
    A.def+=defBonus;
    A.statBuffs.push({stat:'spd',delta:-spdDrop,turnsLeft:A.castOnTurns});
    A.statBuffs.push({stat:'def',delta:defBonus,turnsLeft:A.castOnTurns});
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → 速度-${spdDrop}・防御力+${defBonus}(${A.castOnTurns}ターン)`});
  }
  else if(actId==='cuteGaze'){
    const atkDrop=Math.round(D.atk*A.cuteGazeAtkPct);
    D.atk=Math.max(0,D.atk-atkDrop);
    D.statBuffs.push({stat:'atk',delta:-atkDrop,turnsLeft:A.cuteGazeTurns});
    log.push({c:tagA,icon:s.icon,t:`${s.icon} ${s.name} → 相手の攻撃力を${atkDrop}下げた(${A.cuteGazeTurns}ターン)`});
  }
}
function fireTimed(P,O,cfg,log,tagP,tagO,R){
  for(const k of P.skills){
    const s=SKILLS[k];
    if(!s||s.cat!=='timed'||P.fired[k]) continue;
    if(P.__turn!==P.autohealTurn) continue;
    P.fired[k]=true;
    if(k==='autoheal5'){
      const h=Math.round(P.maxHp*P.autohealPct);
      P.hp=Math.min(P.maxHp,P.hp+h);
      log.push({c:tagP,icon:s.icon,t:`${s.icon} ${s.name}が発動 → ${h}回復`});
    }
  }
}
function resolveTurn(B,a1,a2,cfg,seed){
  const R=rng(seed);
  const p1=B.p1,p2=B.p2;
  p1.dmgTakenLastTurn=p1.dmgTakenThisTurn; p1.dmgTakenThisTurn=0;
  p2.dmgTakenLastTurn=p2.dmgTakenThisTurn; p2.dmgTakenThisTurn=0;
  p1.__turn=B.turn; p2.__turn=B.turn;
  const log=[{c:'t',t:`ターン ${B.turn}`}];

  for(const [P,tg] of [[p1,'d1'],[p2,'d2']]){
    if(P.pendingRegen===B.turn){
      P.pendingRegen=null;
      if(P.hp>0){
        const heal=Math.floor(P.dmgTakenLastTurn*P.regenPct);
        if(heal>0){ P.hp=Math.min(P.maxHp,P.hp+heal); log.push({c:tg,t:`回復スキルの効果 → ${heal}回復`}); }
        else log.push({c:tg,t:`回復スキルの効果 → 回復量はなかった`});
      } else {
        log.push({c:tg,t:`回復スキルの効果は戦闘不能のため発動しなかった`});
      }
    }
  }

  fireTimed(p1,p2,cfg,log,'d1','d2',R);
  fireTimed(p2,p1,cfg,log,'d2','d1',R);

  let order;
  if(p1.spd>p2.spd) order=[[p1,p2,a1,'d1','d2'],[p2,p1,a2,'d2','d1']];
  else if(p2.spd>p1.spd) order=[[p2,p1,a2,'d2','d1'],[p1,p2,a1,'d1','d2']];
  else order = (B.roundFirst||1)===1 ? [[p1,p2,a1,'d1','d2'],[p2,p1,a2,'d2','d1']] : [[p2,p1,a2,'d2','d1'],[p1,p2,a1,'d1','d2']];
  for(const [A,D,act,ta,td] of order){ if(A.hp>0 && D.hp>0) doAction(A,D,act,cfg,log,ta,td,R); }

  if(cfg.dblThr>0 && p1.hp>0 && p2.hp>0){
    if(p1.spd >= p2.spd*cfg.dblThr){log.push({c:'d1',t:`速度差で追撃`});doAction(p1,p2,'attack',cfg,log,'d1','d2',R)}
    else if(p2.spd >= p1.spd*cfg.dblThr){log.push({c:'d2',t:`速度差で追撃`});doAction(p2,p1,'attack',cfg,log,'d2','d1',R)}
  }

  for(const [P,tg] of [[p1,'d1'],[p2,'d2']]){
    if(!P.dots.length) continue;
    let total=0, srcTag=null;
    P.dots.forEach(d=>{ total+=d.dmg; srcTag=d.srcTag; });
    if(total>0 && P.hp>0){
      /* 攻撃者オブジェクトはここで一時的に解決するだけで、状態には
         タグ(d1/d2)しか保存しない。相手を指すオブジェクト参照を
         持たせると循環参照になり、保存・同期が壊れるため。 */
      const src = srcTag==='d1'?p1:(srcTag==='d2'?p2:null);
      const r=dealDamage(P,total,src,{});
      log.push({c:tg,t:`持続攻撃のダメージ → ${r.final}`});
      if(r.insGain>0) log.push({c:tg,t:`傷害保険で${r.insGain}pt獲得`});
      if(r.reflectAmt>0) log.push({c:srcTag,t:`反射で${r.reflectAmt}ダメージ`});
    }
    P.dots = P.dots.filter(d=>{ d.turnsLeft--; return d.turnsLeft>0; });
  }

  for(const P of [p1,p2]){ if(P.tempDRTurns>0) P.tempDRTurns--; }

  for(const [P,tg] of [[p1,'d1'],[p2,'d2']]){
    if(!P.statBuffs || !P.statBuffs.length) continue;
    P.statBuffs = P.statBuffs.filter(b=>{
      b.turnsLeft--;
      if(b.turnsLeft<=0){
        P[b.stat] = Math.max(0, P[b.stat]-b.delta);
        log.push({c:tg,t:`${P.nm}の${STAT_LABEL[b.stat]}変化が元に戻った`});
        return false;
      }
      return true;
    });
  }

  for(const [P,tg] of [[p1,'d1'],[p2,'d2']]){
    if(!P.tradeApplied) continue;
    P.tradeApplied.turnsLeft--;
    if(P.tradeApplied.turnsLeft<=0){
      const {keys,values}=P.tradeApplied;
      P[keys[0]]=values[0]; P[keys[1]]=values[1];
      log.push({c:tg,t:`交換の効果が切れ、ステータスが元に戻った`});
      P.tradeApplied=null;
    }
  }

  return log;
}

/* ============ 通信・状態 ============ */
let db=null, S=null, code=null, me=null, role=0, unsubs=[], I1=null, I2=null, busy=false, busySince=0;
let L={skills:[],rerolls:0,rerollSpent:0,ready:false,act:null,tradeSel:[],tradeTarget:null,buy:{hp:0,atk:0,def:0,spd:0},roleChoice:null,roleReady:false};
let lobbyDrawn=false;

function clientId(){
  let id=sessionStorage.getItem('bsim_cid');
  if(!id){id='c'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('bsim_cid',id)}
  return id;
}
function myName(){ return localStorage.getItem('bsim_name') || ''; }
function resetLocal(){ L={skills:[],rerolls:0,rerollSpent:0,ready:false,act:null,tradeSel:[],tradeTarget:null,buy:{hp:0,atk:0,def:0,spd:0},roleChoice:null,roleReady:false}; }

async function setState(patch){
  S = {...S, ...patch};
  await db.doc('matches/'+code).set(S);
}

/* UIのクリックハンドラから直接呼ぶ用。書き込みが失敗しても画面が
   「送信中」のまま固まらないよう、失敗を検知してトースト表示し、
   渡された onFail で楽観的な表示(待機中フラグなど)を元に戻す。 */
async function safeIntentUpdate(patch, onFail){
  try{
    await myIntentRef().update(patch);
    return true;
  }catch(e){
    console.error('intent update failed:', e);
    toast('通信エラーで送信できませんでした。もう一度お試しください');
    if(onFail) onFail();
    render();
    return false;
  }
}
async function safeSetState(patch, onFail){
  try{
    await setState(patch);
    return true;
  }catch(e){
    console.error('setState failed:', e);
    toast('通信エラーで進行できませんでした。もう一度お試しください');
    if(onFail) onFail();
    render();
    return false;
  }
}

/* Realtime Databaseは値が空配列[]・空オブジェクト{}になった項目を
   保存時に丸ごと消してしまう(Firestoreにはない挙動)。読み込むたびに
   欠けている項目を初期値で復元しておく。 */
function hydrateFighter(f){
  if(!f) return f;
  f.used = f.used || {};
  f.fired = f.fired || {};
  f.dots = f.dots || [];
  f.skills = f.skills || [];
  f.statBuffs = f.statBuffs || [];
  return f;
}
function hydrateMatch(m){
  if(!m) return m;
  m.history = m.history || [];
  m.wins = m.wins || {1:0,2:0};
  m.wallets = m.wallets || {};
  m.wallets[1] = m.wallets[1] || [];
  m.wallets[2] = m.wallets[2] || [];
  m.coins = m.coins || {};
  m.coins[1] = m.coins[1] || [];
  m.coins[2] = m.coins[2] || [];
  m.loadout = m.loadout || {};
  m.loadout[1] = m.loadout[1] || {skills:[]};
  m.loadout[1].skills = m.loadout[1].skills || [];
  m.loadout[2] = m.loadout[2] || {skills:[]};
  m.loadout[2].skills = m.loadout[2].skills || [];
  m.matchEndVotes = m.matchEndVotes || {1:false,2:false};
  m.matchId = m.matchId || 1;
  m.roles = m.roles || {1:null,2:null};
  m.hpBonus = m.hpBonus || {1:0,2:0};
  m.hpBonus[1] = m.hpBonus[1] || 0;
  m.hpBonus[2] = m.hpBonus[2] || 0;
  m.soulStrike = m.soulStrike || {1:false,2:false};
  if(m.battle){
    hydrateFighter(m.battle.p1);
    hydrateFighter(m.battle.p2);
    m.battle.log = m.battle.log || [];
    m.battle.skipVotes = m.battle.skipVotes || {1:false,2:false};
  }
  return m;
}
function myIntentRef(){ return db.doc(`intents/${code}_${role}`); }

function subscribe(){
  unsubs.forEach(u=>{try{u()}catch(e){}}); unsubs=[];
  unsubs.push(db.doc('matches/'+code).onSnapshot(s=>{
    if(!s.exists) return;
    S=hydrateMatch(s.data()); render(); if(role===1) hostTick();
  }, e=>toast('同期エラー: '+e.code)));
  if(role===1){
    for(const n of [1,2]){
      unsubs.push(db.doc(`intents/${code}_${n}`).onSnapshot(s=>{
        const d=s.exists?s.data():null;
        if(n===1) I1=d; else I2=d;
        render(); hostTick();
      }, e=>toast('同期エラー: '+e.code)));
    }
  }
}

/* ============ ホスト進行 ============ */
async function endRound(B, winner){
  const cfg=S.cfg;
  B.over=true;B.winner=winner;
  B.log.push({c:'t',t: winner===0?'引き分け':`${S.names[winner]} の勝利`});
  const wins={...S.wins};
  if(winner) wins[winner]=(wins[winner]||0)+1;
  const hist=[...(S.history||[]),winner];
  const w={1:[...S.wallets[1]],2:[...S.wallets[2]]};
  const nextR=S.round+1;
  for(const p of [1,2]){
    const amt = winner===0 ? Math.round((cfg.winPt+cfg.losePt)/2) : (winner===p?cfg.winPt:cfg.losePt);
    w[p]=[...w[p],{round:nextR,amt}];
  }
  if(B.p1.insuranceGain>0){ w[1]=[...w[1],{round:nextR,amt:B.p1.insuranceGain}]; B.log.push({c:'d1',t:`${S.names[1]}: 傷害保険で合計${B.p1.insuranceGain}pt獲得`}); }
  if(B.p2.insuranceGain>0){ w[2]=[...w[2],{round:nextR,amt:B.p2.insuranceGain}]; B.log.push({c:'d2',t:`${S.names[2]}: 傷害保険で合計${B.p2.insuranceGain}pt獲得`}); }
  const hpBonus = {...(S.hpBonus||{1:0,2:0})};
  if(B.p1.sleepBonusEarned>0){ hpBonus[1]=(hpBonus[1]||0)+B.p1.sleepBonusEarned; B.log.push({c:'d1',t:`${S.names[1]}: 睡眠の効果で最大HP+${B.p1.sleepBonusEarned}が以降も継続`}); }
  if(B.p2.sleepBonusEarned>0){ hpBonus[2]=(hpBonus[2]||0)+B.p2.sleepBonusEarned; B.log.push({c:'d2',t:`${S.names[2]}: 睡眠の効果で最大HP+${B.p2.sleepBonusEarned}が以降も継続`}); }
  const soulStrike = {1:!!B.p1.hasSoulStrike, 2:!!B.p2.hasSoulStrike};
  const coins = {1:[...S.coins[1],{round:nextR,amt:cfg.coinPerRound}], 2:[...S.coins[2],{round:nextR,amt:cfg.coinPerRound}]};
  await setState({phase:'roundEnd',battle:B,wins,history:hist,wallets:w,hpBonus,soulStrike,coins});
}

function noActiveLeft(f){ return (f.skills||[]).filter(k=>SKILLS[k].cat==='active' && !f.used[k]).length===0; }

async function fastForwardBattle(){
  const cfg=S.cfg;
  let B=JSON.parse(JSON.stringify(S.battle));
  let winner=0, over=false, guard=0;
  while(!over && guard<500){
    guard++;
    const seed=hashStr(`${code}|${S.round}|ff|${B.turn}|${guard}`);
    const newLog=resolveTurn(B,'attack','attack',cfg,seed);
    B.log=[...B.log,...newLog].slice(-220);
    B.turn++;
    if(B.p1.hp<=0||B.p2.hp<=0){
      over=true;
      if(B.p1.hp<=0&&B.p2.hp<=0) winner=0; else winner=B.p1.hp>0?1:2;
    } else if(B.turn>cfg.maxTurns){
      over=true;
      const r1=B.p1.hp/B.p1.maxHp, r2=B.p2.hp/B.p2.maxHp;
      winner = r1===r2?0:(r1>r2?1:2);
      B.log.push({c:'t',t:`ターン上限 → 残HP割合で判定`});
    }
  }
  B.log.push({c:'t',t:'両者の合意によりスキップして自動決着'});
  await endRound(B,winner);
}

async function hostTick(){
  if(role!==1 || !S) return;
  if(busy){
    /* 書き込みがネットワーク不調などで長時間ペンディングのまま返ってこないと
       busyフラグが解除されず進行が永久に止まるため、一定時間で強制的に
       解除して次のtickをやり直せるようにする */
    if(Date.now()-busySince > 8000){ busy=false; }
    else return;
  }
  try{
    busy=true; busySince=Date.now();
    /* 4勝先取後の終了投票。スキップ投票と同じく各自のintentを集計して
       S.matchEndVotes に反映し、両者が賛成したら最終結果へ進める。
       票は試合(matchId)単位で有効で、ラウンドをまたいでも保持する。
       再戦でmatchIdが変わるため、前の試合の票は数えない。 */
    if((S.phase==='shop'||S.phase==='battle'||S.phase==='roundEnd') && majorityReached()){
      const ev=I=>!!(I&&I.endVote&&I.endVote.match===S.matchId&&I.endVote.agree);
      const e1=ev(I1), e2=ev(I2);
      const curE=S.matchEndVotes||{1:false,2:false};
      if(e1 && e2){
        await setState({phase:'matchEnd', endedEarly:true, matchEndVotes:{1:false,2:false}});
        return;
      }
      if(curE[1]!==e1 || curE[2]!==e2){
        await setState({matchEndVotes:{1:e1,2:e2}});
      }
    }
    if(S.phase==='lobby' && !S.guest && I2 && I2.clientId){
      await setState({guest:I2.clientId, names:{...S.names, 2:I2.name||'プレイヤー2'}});
      render();
    }
    else if(S.phase==='roleSelect'){
      const r1=I1&&I1.roleChoice&&ROLES[I1.roleChoice]?I1.roleChoice:null;
      const r2=I2&&I2.roleChoice&&ROLES[I2.roleChoice]?I2.roleChoice:null;
      if(r1 && r2){
        await setState({phase:'shop', roles:{1:r1,2:r2}});
      }
    }
    else if(S.phase==='shop'){
      const a=I1&&I1.shop&&I1.shop.round===S.round?I1.shop:null;
      const b=I2&&I2.shop&&I2.shop.round===S.round?I2.shop:null;
      if(a&&b) await startBattle(a,b);
    }
    else if(S.phase==='battle'){
      const v1=!!(I1&&I1.skipVote&&I1.skipVote.round===S.round&&I1.skipVote.agree);
      const v2=!!(I2&&I2.skipVote&&I2.skipVote.round===S.round&&I2.skipVote.agree);
      const curV=S.battle.skipVotes||{1:false,2:false};
      if(curV[1]!==v1 || curV[2]!==v2){
        await setState({battle:{...S.battle, skipVotes:{1:v1,2:v2}}});
      }
      if(v1 && v2){
        await fastForwardBattle();
      } else {
        const t=S.battle.turn;
        const a=I1&&I1.act&&I1.act.round===S.round&&I1.act.turn===t?I1.act.action:null;
        const b=I2&&I2.act&&I2.act.round===S.round&&I2.act.turn===t?I2.act.action:null;
        if(a&&b) await stepBattle(a,b);
      }
    }
  }catch(e){ console.error(e); toast('進行エラー: '+(e.code||e.message||e)); }
  finally{ busy=false; }
}

function applyShop(intent, wallet, base, cfg){
  /* 魂魄理念だけは所持済でも再購入を許可する(購入のたびに付与/解除がトグルするため) */
  const skills=(intent.skills||[]).filter(s=>SKILLS[s] && (s==='soulStrike' || !(base.skills||[]).includes(s)));
  const rerollCost=(()=>{let c=0;for(let i=0;i<(intent.rerolls||0);i++)c+=cfg.rerollBase*(i+1);return c})();
  const spend=skills.reduce((s,k)=>s+costOf(k,cfg),0) + rerollCost;
  const have=walletTotal(wallet);
  if(spend>have) return {wallet, load:base, ok:false, newlyBought:[]};
  const load={ skills: Array.from(new Set([...(base.skills||[]), ...skills])) };
  return {wallet: walletSpend(wallet,spend), load, ok:true, newlyBought:skills};
}

/* pt/スキルとは別建てのコイン経済。base(前回のloadout)に積み上がっている
   ステータス購入分を引き継ぎつつ、今回コインで新たに買った分を加算する。 */
function applyCoinShop(intent, coinWallet, base, cfg){
  const buy = intent.buy || {hp:0,atk:0,def:0,spd:0};
  const spend = coinCostFor(buy.hp,cfg)+coinCostFor(buy.atk,cfg)+coinCostFor(buy.def,cfg)+coinCostFor(buy.spd,cfg);
  const have = walletTotal(coinWallet);
  const carried = {hp:base.hp||0, atk:base.atk||0, def:base.def||0, spd:base.spd||0};
  if(spend>have) return {coinWallet, statBonus:carried, ok:false};
  const statBonus = {
    hp: carried.hp + (buy.hp|0)*cfg.hpPerCoin,
    atk: carried.atk + (buy.atk|0)*cfg.atkPerCoin,
    def: carried.def + (buy.def|0)*cfg.defPerCoin,
    spd: carried.spd + (buy.spd|0)*cfg.spdPerCoin,
  };
  return {coinWallet: walletSpend(coinWallet,spend), statBonus, ok:true};
}

async function startBattle(a,b){
  const cfg=S.cfg;
  const r1=applyShop(a,S.wallets[1],S.loadout[1],cfg);
  const r2=applyShop(b,S.wallets[2],S.loadout[2],cfg);
  const rc1=applyCoinShop(a,S.coins[1],S.loadout[1],cfg);
  const rc2=applyCoinShop(b,S.coins[2],S.loadout[2],cfg);
  const load1={...r1.load, ...rc1.statBonus}, load2={...r2.load, ...rc2.statBonus};
  const hpBonus = S.hpBonus||{1:0,2:0};
  const soulStrike = {...(S.soulStrike||{1:false,2:false})};
  const log=[];
  if(r1.ok && r1.newlyBought.includes('soulStrike')){
    soulStrike[1] = !soulStrike[1];
    log.push({c:'d1',icon:SKILLS.soulStrike.icon,t:`${SKILLS.soulStrike.icon} ${S.names[1]}: ${SKILLS.soulStrike.name}を購入 → ${soulStrike[1]?'『魂の打撃』を付与(以降のラウンドにも持ち越されます)':'『魂の打撃』を解除(以降のラウンドにも持ち越されます)'}`});
  }
  if(r2.ok && r2.newlyBought.includes('soulStrike')){
    soulStrike[2] = !soulStrike[2];
    log.push({c:'d2',icon:SKILLS.soulStrike.icon,t:`${SKILLS.soulStrike.icon} ${S.names[2]}: ${SKILLS.soulStrike.name}を購入 → ${soulStrike[2]?'『魂の打撃』を付与(以降のラウンドにも持ち越されます)':'『魂の打撃』を解除(以降のラウンドにも持ち越されます)'}`});
  }
  const NEUTRAL_MULT={hp:1,atk:1,def:1,spd:1};
  const roleMult1=(ROLES[S.roles&&S.roles[1]]||{mult:NEUTRAL_MULT}).mult, roleMult2=(ROLES[S.roles&&S.roles[2]]||{mult:NEUTRAL_MULT}).mult;
  const f1=mkFighter(load1,cfg,S.names[1],hpBonus[1],soulStrike[1],roleMult1), f2=mkFighter(load2,cfg,S.names[2],hpBonus[2],soulStrike[2],roleMult2);
  if(!r1.ok) log.push({c:'t',t:`${S.names[1]}: pt不足のためスキル購入は無効`});
  if(!r2.ok) log.push({c:'t',t:`${S.names[2]}: pt不足のためスキル購入は無効`});
  if(!rc1.ok) log.push({c:'t',t:`${S.names[1]}: コイン不足のためステータス購入は無効`});
  if(!rc2.ok) log.push({c:'t',t:`${S.names[2]}: コイン不足のためステータス購入は無効`});
  const nextR=S.round+1;
  let w1=r1.wallet, w2=r2.wallet;
  const econBonus = paramOf('econSkill','bonus',cfg);
  if(r1.ok && r1.newlyBought.includes('econSkill')){ w1=[...w1,{round:nextR,amt:econBonus}]; log.push({c:'t',t:`${S.names[1]}: ${SKILLS.econSkill.name}で次ラウンド開始時+${econBonus}pt確定`}); }
  if(r2.ok && r2.newlyBought.includes('econSkill')){ w2=[...w2,{round:nextR,amt:econBonus}]; log.push({c:'t',t:`${S.names[2]}: ${SKILLS.econSkill.name}で次ラウンド開始時+${econBonus}pt確定`}); }
  const roundFirst = (S.round % 2 === 1) ? 1 : 2;
  log.push({c:'t',t:`ラウンド ${S.round} 開始 ・ 同速時の先攻: ${S.names[roundFirst]}`});
  await setState({
    phase:'battle',
    wallets:{1:w1,2:w2},
    coins:{1:rc1.coinWallet,2:rc2.coinWallet},
    loadout:{1:load1,2:load2},
    battle:{turn:1,p1:f1,p2:f2,log,over:false,winner:0,roundFirst}
  });
}

async function stepBattle(a1,a2){
  const cfg=S.cfg, B=JSON.parse(JSON.stringify(S.battle));
  const seed=hashStr(`${code}|${S.round}|${B.turn}|${a1}|${a2}`);
  const newLog=resolveTurn(B,a1,a2,cfg,seed);
  B.log=[...B.log,...newLog].slice(-220);
  B.turn++;
  let winner=0, over=false;
  if(B.p1.hp<=0||B.p2.hp<=0){
    over=true;
    if(B.p1.hp<=0&&B.p2.hp<=0) winner=0;
    else winner=B.p1.hp>0?1:2;
  } else if(B.turn>cfg.maxTurns){
    over=true;
    const r1=B.p1.hp/B.p1.maxHp, r2=B.p2.hp/B.p2.maxHp;
    winner = r1===r2?0:(r1>r2?1:2);
    B.log.push({c:'t',t:`ターン上限 → 残HP割合で判定`});
  }
  if(!over){ await setState({battle:B}); return; }
  await endRound(B, winner);
}

async function nextRound(){
  const cfg=S.cfg;
  if(S.round>=cfg.rounds){ await safeSetState({phase:'matchEnd'}); return; }
  const nextR=S.round+1;
  const w={1:walletExpire(S.wallets[1],nextR,cfg.ptLife),2:walletExpire(S.wallets[2],nextR,cfg.ptLife)};
  const coins={1:walletExpire(S.coins[1],nextR,cfg.coinLife),2:walletExpire(S.coins[2],nextR,cfg.coinLife)};
  const carryOver=(p)=>{
    const prev=S.loadout[p]||{};
    return {
      skills: cfg.resetEachRound ? [] : (prev.skills||[]),
      hp:  cfg.resetStatsEachRound ? 0 : (prev.hp||0),
      atk: cfg.resetStatsEachRound ? 0 : (prev.atk||0),
      def: cfg.resetStatsEachRound ? 0 : (prev.def||0),
      spd: cfg.resetStatsEachRound ? 0 : (prev.spd||0),
    };
  };
  const load={1:carryOver(1),2:carryOver(2)};
  resetLocal();
  if(!await safeIntentUpdate({clientId:me,name:S.names[role]})) return;
  await safeSetState({phase:'shop',round:nextR,wallets:w,coins,loadout:load,battle:null});
}

/* ============ ルーム作成/参加 ============ */
async function createRoom(name,cfg){
  code=Math.random().toString(36).slice(2,7).toUpperCase();
  role=1;
  localStorage.setItem('bsim_name',name);
  S={
    host:me,guest:null,names:{1:name,2:'プレイヤー2'},cfg,
    phase:'lobby',round:1,wins:{1:0,2:0},history:[],
    matchEndVotes:{1:false,2:false},endedEarly:false,matchId:1,hpBonus:{1:0,2:0},soulStrike:{1:false,2:false},
    roles:{1:null,2:null},
    wallets:{1:[{round:1,amt:cfg.startPt}],2:[{round:1,amt:cfg.startPt}]},
    coins:{1:[{round:1,amt:cfg.startCoin}],2:[{round:1,amt:cfg.startCoin}]},
    loadout:{1:{skills:[],hp:0,atk:0,def:0,spd:0},2:{skills:[],hp:0,atk:0,def:0,spd:0}},
    battle:null
  };
  await db.doc('matches/'+code).set(S);
  await db.doc(`intents/${code}_1`).set({clientId:me,name});
  await db.doc(`intents/${code}_2`).set({clientId:null});
  subscribe(); render();
}
async function joinRoom(name,c){
  const snap=await db.doc('matches/'+c.toUpperCase()).get();
  if(!snap.exists){ toast('そのルームは見つかりません'); return; }
  code=c.toUpperCase(); role=2; localStorage.setItem('bsim_name',name);
  S=hydrateMatch(snap.data());
  if(S.guest && S.guest!==me){ toast('このルームは満員です'); code=null;role=0;return; }
  await db.doc(`intents/${code}_2`).set({clientId:me,name});
  subscribe(); render();
}

/* ============ 画面 ============ */
function spentTotal(){ return L.skills.reduce((s,k)=>s+costOf(k),0) + L.rerollSpent; }
function availPt(){ return walletTotal(S.wallets[role]) - spentTotal(); }
function spentCoinTotal(){
  const cfg=S&&S.cfg;
  return coinCostFor(L.buy.hp,cfg)+coinCostFor(L.buy.atk,cfg)+coinCostFor(L.buy.def,cfg)+coinCostFor(L.buy.spd,cfg);
}
function availCoin(){ return walletTotal(S.coins[role]) - spentCoinTotal(); }

function renderTrack(){
  if(!S){$('#track').innerHTML='';return}
  const h=S.history||[];let out='';
  for(let i=1;i<=S.cfg.rounds;i++){
    const r=h[i-1];
    const cls = r===1?'w1':r===2?'w2':(r===0&&i<=h.length)?'dr':(i===S.round?'now':'');
    out+=`<i class="${cls}">${i}</i>`;
  }
  $('#track').innerHTML=out;
  $('#codeLabel').innerHTML = code?`ルーム <b class="num">${code}</b> ・ ${esc(S.names[role]||'')}(P${role})`:'';
}

function majorityReached(){
  if(!S || !S.cfg || !S.wins) return false;
  const maj = Math.floor(S.cfg.rounds/2)+1;
  return S.wins[1]>=maj || S.wins[2]>=maj;
}
function renderEndUI(){
  const box=$('#endBox');
  if(!box) return;
  if(!S || S.phase==='lobby' || S.phase==='matchEnd' || !majorityReached()){
    box.innerHTML=''; return;
  }
  const votes=S.matchEndVotes||{1:false,2:false};
  const opp=role===1?2:1;
  const note = votes[opp]&&!votes[role] ? '相手が終了を希望しています'
             : votes[role]&&!votes[opp] ? '相手の同意待ち' : '';
  box.innerHTML=`
    ${note?`<span class="muted endNote">${note}</span>`:''}
    <button class="btn ${votes[role]?'':'ghost'} sm" id="endVoteBtn" title="双方が賛成すると、この時点で試合を終了します">終了</button>
    <span class="skipSq ${votes[1]?'on':''}"></span>
    <span class="skipSq ${votes[2]?'on':''}"></span>
  `;
  const evb=box.querySelector('#endVoteBtn');
  if(evb) evb.onclick=async()=>{
    const newVal=!votes[role];
    await safeIntentUpdate({clientId:me,name:S.names[role], endVote:{match:S.matchId, agree:newVal}});
  };
}
function renderSkipUI(){
  const box=$('#skipBox');
  if(!box) return;
  if(!S || S.phase!=='battle' || !S.battle || !(noActiveLeft(S.battle.p1) && noActiveLeft(S.battle.p2))){
    box.innerHTML=''; return;
  }
  const votes=S.battle.skipVotes||{1:false,2:false};
  box.innerHTML=`
    <button class="btn ${votes[role]?'':'ghost'} sm" id="skipVoteBtn" title="双方が賛成すると残りを自動で決着させます">スキップ</button>
    <span class="skipSq ${votes[1]?'on':''}"></span>
    <span class="skipSq ${votes[2]?'on':''}"></span>
  `;
  const svb=box.querySelector('#skipVoteBtn');
  if(svb) svb.onclick=async()=>{
    const newVal=!votes[role];
    await safeIntentUpdate({clientId:me,name:S.names[role], skipVote:{round:S.round, agree:newVal}});
  };
}

function render(){
  try{
    renderTrack();
    renderEndUI();
    renderSkipUI();
    const st=$('#stage');
    if(!S){ return; }
    if(S.phase==='lobby'){ renderLobby(st); return; }
    lobbyDrawn=false;
    if(S.phase==='roleSelect') renderRoleSelect(st);
    else if(S.phase==='shop') renderShop(st);
    else if(S.phase==='battle') renderBattle(st);
    else if(S.phase==='roundEnd') renderRoundEnd(st);
    else if(S.phase==='matchEnd') renderMatchEnd(st);
  }catch(e){
    console.error('render error:', e);
    toast('画面の描画でエラーが発生しました(進行は続けます): '+(e.message||e));
    const st=$('#stage');
    if(st) st.innerHTML += `<div class="panel"><p class="muted">直前の描画でエラーが発生しました。ページを再読み込みすると復帰することがあります。</p></div>`;
  }
}

function renderRoleSelect(st){
  const myChoice = L.roleChoice;
  const oppReady = role===1 ? !!(I2&&I2.roleChoice&&ROLES[I2.roleChoice]) : false;
  st.innerHTML=`
  <div class="panel">
    <h2>ロールを選択 <small>試合開始前に1度だけ選びます。あとから変更できません</small></h2>
    <div class="shop">
      ${ROLE_IDS.map(k=>{
        const r=ROLES[k];
        const cfg=S.cfg;
        const on=myChoice===k;
        return `<div class="skill ${on?'on':''}">
          <div class="h"><span class="nm">${r.icon} ${r.name}</span></div>
          <span class="d">${r.desc}</span>
          <span class="sub num" style="margin-top:4px">HP${Math.round(cfg.baseHp*r.mult.hp)}　攻${Math.round(cfg.baseAtk*r.mult.atk)}　防${Math.round(cfg.baseDef*r.mult.def)}　速${Math.round(cfg.baseSpd*r.mult.spd)}</span>
          <button class="btn ${on?'':'ghost'} sm" style="margin-top:8px" data-role="${k}" ${L.roleReady?'disabled':''}>${on?'選択中':'これを選ぶ'}</button>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="panel">
    <div class="row">
      <button class="btn" id="roleReadyBtn" ${(!myChoice||L.roleReady)?'disabled':''}>${L.roleReady?'相手を待っています…':'このロールで確定'}</button>
      ${role===1?`<span class="muted">${oppReady?'相手は確定済み':'相手はまだ選択中'}</span>`:''}
    </div>
  </div>`;
  st.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
    if(L.roleReady) return;
    L.roleChoice=b.dataset.role; render();
  });
  const rb=$('#roleReadyBtn'); if(rb) rb.onclick=async()=>{
    L.roleReady=true; render();
    await safeIntentUpdate({clientId:me,name:S.names[role], roleChoice:L.roleChoice}, ()=>{ L.roleReady=false; });
  };
}

function renderLobby(st){
  if(!lobbyDrawn){
    lobbyDrawn=true;
    st.innerHTML=`<div class="panel">
      <h2>ルームができました</h2>
      <p class="muted">この合言葉を相手に伝えてください。同じページを開いて「参加する」に入力します。</p>
      <div class="row" style="align-items:baseline">
        <div class="codebox num">${code}</div>
        <button class="btn ghost sm" id="copyCodeBtn">コピー</button>
      </div>
      <p class="muted" id="waitLine"></p>
      ${role===1?`<div class="row" style="margin-top:12px"><button class="btn" id="startBtn">試合を始める</button></div>`:''}
    </div>`;
    if(role===1) $('#startBtn').onclick=async()=>{ resetLocal(); await safeSetState({phase:S.cfg.useRoles?'roleSelect':'shop'}); };
    const cb=$('#copyCodeBtn'); if(cb) cb.onclick=async()=>{
      try{
        await navigator.clipboard.writeText(code);
        toast('合言葉をコピーしました');
      }catch(e){
        /* clipboard APIが使えない環境向けのフォールバック */
        const ta=document.createElement('textarea');
        ta.value=code; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); toast('合言葉をコピーしました'); }
        catch(e2){ toast('コピーに失敗しました。手動で選択してコピーしてください'); }
        document.body.removeChild(ta);
      }
    };
  }
  /* 参加状況の反映は毎回ここで無条件に行う(初回描画・再描画どちらでも同じ経路を通す) */
  const w=$('#waitLine'); if(w) w.textContent = S.guest?`${S.names[2]} が参加しました`:'相手の参加を待っています…';
  const b=$('#startBtn'); if(b) b.disabled=!S.guest;
}

function skillCard(k,owned,on,afford){
  const s=SKILLS[k], cost=costOf(k);
  let btnLabel, btnDisabled;
  if(owned){ btnLabel='所持済'; btnDisabled=true; }
  else if(on){ btnLabel='取り消す'; btnDisabled=false; }
  else { btnLabel=`${cost}ptで購入`; btnDisabled=!afford; }
  return `<div class="skill ${on?'on':''}">
    <div class="h"><span class="nm">${s.icon||''} ${s.name}</span><span class="cost num">${owned?'所持済':cost+'pt'}</span></div>
    <span class="tag ${tagClsFor(s)}">${tagFor(k)}</span>
    <span class="d">${descFor(k)}</span>
    <button class="btn ${on?'ghost':'sm'}" style="margin-top:4px;align-self:stretch;justify-content:center;display:flex" data-buyskill="${k}" ${btnDisabled?'disabled':''}>${btnLabel}</button>
  </div>`;
}

function coinStatLine(key,label,baseVal,perCoin){
  const cfg=S.cfg;
  const units=L.buy[key];
  const add=units*perCoin;
  const cost=coinCostFor(units,cfg);
  const avail=availCoin();
  const tierSize=cfg.coinTierSize||100;
  const curPrice=Math.floor(units/tierSize)+1; /* 次の1ユニットの単価 */
  const costOf10=coinCostFor(units+10,cfg)-cost;
  const costOf100=coinCostFor(units+100,cfg)-cost;
  return `<div class="stat">
    <div class="nm">${label}</div>
    <div>
      <div class="val num">${baseVal+add}${add?` <em>+${add}</em>`:''}</div>
      <div class="sub num">${units}ユニット購入(${cost}コイン) / 現在単価 ${curPrice}コイン/ユニット</div>
    </div>
    <div class="steps">
      <button class="step" data-buy="${key}" data-amt="-100" ${units<100?'disabled':''}>-100</button>
      <button class="step" data-buy="${key}" data-amt="-10" ${units<10?'disabled':''}>-10</button>
      <button class="step" data-buy="${key}" data-amt="10" ${avail<costOf10?'disabled':''}>+10</button>
      <button class="step" data-buy="${key}" data-amt="100" ${avail<costOf100?'disabled':''}>+100</button>
    </div>
  </div>`;
}
function renderShop(st){
  const cfg=S.cfg, base=S.loadout[role];
  const myRole = ROLES[S.roles&&S.roles[role]] || null;
  const myRoleMult = myRole ? myRole.mult : {hp:1,atk:1,def:1,spd:1};
  const opts=shopFor(code,S.round,role,L.rerolls);
  const nextReroll=cfg.rerollBase*(L.rerolls+1);
  const wallet=S.wallets[role];
  const coinWallet=S.coins[role];
  const oppReady = role===1 ? !!(I2&&I2.shop&&I2.shop.round===S.round) : false;
  const ownedList=(base.skills||[]);
  st.innerHTML=`
  <div class="panel">
    <h2>ラウンド ${S.round} ・ 編成 <small>勝敗 ${S.wins[1]} - ${S.wins[2]}</small></h2>
    <div class="wallet">
      <span class="big num">${availPt()}</span><span class="muted">pt 使用可能(スキル購入専用)</span>
      ${wallet.map(e=>`<span class="chip num${S.round-e.round===cfg.ptLife-1?' warn':''}">R${e.round}獲得 ${e.amt}pt${S.round-e.round===cfg.ptLife-1?' ・今R限り':''}</span>`).join('')}
    </div>
    <div class="wallet" style="margin-top:8px">
      <span class="big num" style="color:var(--ok)">${availCoin()}</span><span class="muted">コイン 使用可能(ステータス購入専用)</span>
      ${coinWallet.map(e=>`<span class="chip num${S.round-e.round===cfg.coinLife-1?' warn':''}">R${e.round}獲得 ${e.amt}コイン${S.round-e.round===cfg.coinLife-1?' ・今R限り':''}</span>`).join('')}
    </div>
    <div class="stats" style="margin-top:10px">
      <div class="stat"><div class="nm">基礎値</div><div class="val num">HP${Math.round(cfg.baseHp*myRoleMult.hp)}　攻${Math.round(cfg.baseAtk*myRoleMult.atk)}　防${Math.round(cfg.baseDef*myRoleMult.def)}　速${Math.round(cfg.baseSpd*myRoleMult.spd)}</div></div>
      <div class="stat"><div class="nm">ロール</div><div class="val num">${myRole?`${myRole.icon} ${myRole.name}`:'未選択'}</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>ステータス購入 <small>コインで直接ステータスを強化(スキルとは別枠)</small></h2>
    <div class="stats">
      ${coinStatLine('hp','HP',cfg.baseHp+(base.hp||0),cfg.hpPerCoin)}
      ${coinStatLine('atk','攻撃力',cfg.baseAtk+(base.atk||0),cfg.atkPerCoin)}
      ${coinStatLine('def','防御力',cfg.baseDef+(base.def||0),cfg.defPerCoin)}
      ${coinStatLine('spd','速度',cfg.baseSpd+(base.spd||0),cfg.spdPerCoin)}
    </div>
  </div>

  <div class="panel">
    <h2>所持スキル <small>これまでに購入したスキルと効果</small></h2>
    ${ownedList.length
      ? `<div class="shop">${ownedList.map(k=>{
          const s=SKILLS[k];
          return `<div class="skill on" style="cursor:default">
            <div class="h"><span class="nm">${s.icon||''} ${s.name}</span></div>
            <span class="tag ${tagClsFor(s)}">${tagFor(k)}</span>
            <span class="d">${descFor(k)}</span>
          </div>`;
        }).join('')}</div>`
      : '<p class="muted">まだスキルを所持していません</p>'}
  </div>

  <div class="panel">
    <h2>スキルショップ <small>3枠からランダム・カードごとに購入を確定します</small></h2>
    <div class="shop">
      ${opts.map(k=>{
        const owned=ownedList.includes(k) && k!=='soulStrike';
        const on=L.skills.includes(k);
        const afford = on || owned || availPt()>=costOf(k);
        return skillCard(k,owned,on,afford);
      }).join('')}
    </div>
    <div class="row" style="margin-top:11px">
      <button class="btn ghost sm" id="rerollBtn" ${availPt()<nextReroll?'disabled':''}>並べ替える(${nextReroll}pt)</button>
      <span class="muted">更新するたびに次の費用が上がります</span>
    </div>
  </div>

  <div class="panel">
    <h2>今回選んだスキル <small>まだ確定前の分だけ表示。各カードのボタンで購入します</small></h2>
    ${L.skills.length
      ? `<div class="shop">${L.skills.map(k=>{
          const s=SKILLS[k];
          return `<div class="skill on">
            <div class="h"><span class="nm">${s.icon||''} ${s.name}</span><span class="cost num">${costOf(k)}pt</span></div>
            <span class="tag ${tagClsFor(s)}">${tagFor(k)}</span>
            <span class="d">${descFor(k)}</span>
          </div>`;
        }).join('')}</div>
        <p class="muted num" style="margin-top:8px">今回の購入合計 ${L.skills.reduce((s,k)=>s+costOf(k),0)}pt</p>`
      : '<p class="muted">まだ何も購入していません</p>'}
  </div>

  <div class="panel">
    <div class="row">
      <button class="btn" id="readyBtn" ${L.ready?'disabled':''}>${L.ready?'相手を待っています…':'この編成で確定'}</button>
      ${role===1?`<span class="muted">${oppReady?'相手は確定済み':'相手はまだ編成中'}</span>`:''}
      ${L.ready?'':'<span class="muted">確定すると変更できません</span>'}
    </div>
  </div>`;

  st.querySelectorAll('[data-buyskill]').forEach(b=>b.onclick=()=>{
    if(L.ready)return;
    const k=b.dataset.buyskill;
    L.skills = L.skills.includes(k) ? L.skills.filter(x=>x!==k) : [...L.skills,k];
    render();
  });
  st.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    if(L.ready)return;
    const k=b.dataset.buy, amt=parseInt(b.dataset.amt,10);
    /* 単価が逓増するため上限はボタンのdisabled判定( render時の費用計算)で
       担保している。ここでは0未満にだけならないようにする */
    L.buy[k]=Math.max(0, L.buy[k]+amt);
    render();
  });

  const rb=$('#rerollBtn'); if(rb) rb.onclick=()=>{
    if(L.ready)return;
    L.rerollSpent+=nextReroll; L.rerolls++;
    render();
  };
  $('#readyBtn').onclick=async()=>{
    L.ready=true; render();
    await safeIntentUpdate({clientId:me,name:S.names[role],
      shop:{round:S.round,skills:[...L.skills],rerolls:L.rerolls,buy:{...L.buy}}}, ()=>{ L.ready=false; });
  };
}

function renderLogHtml(log){
  let startIdx=0;
  for(let i=log.length-1;i>=0;i--){
    if(/^ターン \d+$/.test(log[i].t)){ startIdx=i; break; }
  }
  return log.map((l,i)=>`<p class="${l.c}${i>=startIdx?' fresh':''}">${esc(l.t)}</p>`).join('');
}
function fighterBadges(f){
  const badges=[];
  if(f.hasSoulStrike) badges.push({t:`👻 魂の打撃 有効`, d:`通常攻撃が最大HPの${Math.round((f.soulStrikePct||0.05)*100)}%ダメージになっている(永続)`});
  if(f.tempDRTurns>0) badges.push({t:`被ダメ軽減 残り${f.tempDRTurns}T`, d:'受けるダメージ-10%'});
  if(f.reflectArmed) badges.push({t:'反射 待機中', d:'次に受けるダメージの30%を反射する'});
  if(f.nextAttackMulti) badges.push({t:'次の通常攻撃が5連撃', d:'攻撃スキルの効果'});
  if(f.sleepSkip) badges.push({t:'次ターン行動不能', d:'睡眠の効果'});
  if(f.pendingRegen) badges.push({t:'次ターン開始時に回復予定', d:'回復スキルの効果'});
  if(f.dots && f.dots.length){
    const left=Math.max(...f.dots.map(d=>d.turnsLeft));
    const dmg=f.dots[0].dmg;
    badges.push({t:`持続ダメージ 残り${left}T`, d:`毎ターン${dmg}ダメージ`});
  }
  (f.statBuffs||[]).forEach(b=>{
    const sign=b.delta>=0?'+':'';
    badges.push({t:`${STAT_LABEL[b.stat]}${sign}${b.delta} 残り${b.turnsLeft}T`, d:'一定ターンで元に戻ります'});
  });
  (f.skills||[]).forEach(k=>{
    const s=SKILLS[k];
    if(s.cat==='timed') badges.push({t:f.fired[k]?`${s.icon} ${s.name}(発動済)`:`${s.icon} ${s.name}(${f.autohealTurn}T後)`,d:descFor(k)});
    else if(s.cat==='active') badges.push({t:f.used[k]?`${s.icon} ${s.name}(使用済)`:`${s.icon} ${s.name}`,d:descFor(k)});
    else badges.push({t:`${s.icon} ${s.name}`,d:descFor(k)});
  });
  return badges;
}
function fighterCard(n){
  const B=S.battle, f=n===1?B.p1:B.p2;
  const mine = n===role;
  const pct=Math.max(0,f.hp/f.maxHp*100);
  const col=n===1?'var(--p1)':'var(--p2)';
  return `<div class="fighter ${mine?'me':''}">
    <div class="who ${n===1?'p1c':'p2c'}">${esc(f.nm)}${mine?'(あなた)':''}</div>
    <div class="hpbarWrap">
      <div class="hpbar"><div style="width:${pct}%;background:${col}"></div></div>
      <div class="hpFx" id="hpFx${n}"></div>
    </div>
    <div class="hpnum num">${f.hp} / ${f.maxHp}</div>
    ${mine
      ? `<div class="miniStats num">攻 ${Math.round(f.atk)}　防 ${Math.round(f.def)}　速 ${Math.round(f.spd)}</div>
         <div class="skillInfo">${fighterBadges(f).map(b=>`<div class="skillInfoRow"><span class="badge">${esc(b.t)}</span>${b.d?`<span class="skillInfoD">${esc(b.d)}</span>`:''}</div>`).join('')}</div>`
      : `<div class="miniStats num muted">スキル・強化状況は非公開</div>`}
  </div>`;
}

function renderBattle(st){
  const B=S.battle, mine=role===1?B.p1:B.p2;
  const waiting = L.act && L.act.turn===B.turn;
  const acts=['attack',...(mine.skills||[]).filter(k=>SKILLS[k].cat==='active' && !mine.used[k])];
  const hasTrade = acts.includes('trade');
  st.innerHTML=`
  <div class="panel">
    <h2>ラウンド ${S.round} ・ ターン ${B.turn} <small>上限 ${S.cfg.maxTurns}</small></h2>
    <div class="field2">${fighterCard(1)}${fighterCard(2)}</div>
    <div class="acts">
      ${acts.filter(k=>k!=='trade').map(k=>`<button class="btn ${k==='attack'?'':'ghost'}" data-act="${k}" ${waiting?'disabled':''}>
        <span class="actName">${k==='attack'?'⚔️ 通常攻撃':`${SKILLS[k].icon||''} ${SKILLS[k].name}`}</span>
        <span class="actD">${k==='attack'?(mine.nextAttackMulti?`攻撃スキルの効果で${mine.nextAttackMulti.hits}連撃になる`:'相手に通常ダメージを与える'):descFor(k)}</span>
      </button>`).join('')}
    </div>
    ${hasTrade ? `<div class="tradeBox">
      <div class="muted" style="margin-bottom:6px">交換 ─ 対象と、入れ替えるステータス2つを選ぶ</div>
      <div class="row">
        <button class="btn ${L.tradeTarget==='self'?'':'ghost'} sm" data-tradetarget="self" ${waiting?'disabled':''}>自分を対象</button>
        <button class="btn ${L.tradeTarget==='opp'?'':'ghost'} sm" data-tradetarget="opp" ${waiting?'disabled':''}>相手を対象</button>
      </div>
      <div class="row" style="margin-top:8px">
        ${['hp','atk','def','spd'].map(k=>`<button class="btn ${L.tradeSel.includes(k)?'':'ghost'} sm" data-tradekey="${k}" ${waiting?'disabled':''}>${STAT_LABEL[k]}</button>`).join('')}
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="tradeGo" ${(L.tradeTarget && L.tradeSel.length===2 && !waiting)?'':'disabled'}>この2つを入れ替えて実行</button>
      </div>
    </div>` : ''}
    <p class="muted" style="margin-top:8px">${waiting?'相手の行動を待っています…':'行動を選ぶと、速度の速いほうから処理されます'}</p>
  </div>
  <div class="panel">
    <h2>戦闘ログ</h2>
    <div class="log" id="log">${renderLogHtml(B.log)}</div>
  </div>`;
  st.querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    L.act={turn:B.turn,action:b.dataset.act}; render();
    await safeIntentUpdate({clientId:me,name:S.names[role],
      act:{round:S.round,turn:B.turn,action:b.dataset.act}}, ()=>{ L.act=null; });
  });
  st.querySelectorAll('[data-tradetarget]').forEach(b=>b.onclick=()=>{
    if(waiting)return;
    L.tradeTarget = b.dataset.tradetarget;
    render();
  });
  st.querySelectorAll('[data-tradekey]').forEach(b=>b.onclick=()=>{
    if(waiting)return;
    const k=b.dataset.tradekey;
    L.tradeSel = L.tradeSel.includes(k) ? L.tradeSel.filter(x=>x!==k) : (L.tradeSel.length<2?[...L.tradeSel,k]:L.tradeSel);
    render();
  });
  const tg=$('#tradeGo'); if(tg) tg.onclick=async()=>{
    const [k1,k2]=L.tradeSel;
    /* 自分視点の self/opp を、サーバー側で扱うプレイヤー番号(1/2)に変換して送る */
    const targetRole = L.tradeTarget==='self' ? String(role) : String(role===1?2:1);
    const action=`trade:${k1}:${k2}:${targetRole}`;
    L.act={turn:B.turn,action}; L.tradeSel=[]; L.tradeTarget=null; render();
    await safeIntentUpdate({clientId:me,name:S.names[role],
      act:{round:S.round,turn:B.turn,action}}, ()=>{ L.act=null; });
  };
  const lg=$('#log'); if(lg) lg.scrollTop=lg.scrollHeight;
  triggerHpFx(B);
}

/* 直前の再描画以降に増えたログを見て、スキル発動アイコンをそのプレイヤーの
   HPバー付近にポップ表示する。ラウンドが変わったら基準をリセットする。 */
let fxLastRound=-1, fxLastLen=-1;
function triggerHpFx(B){
  if(S.round!==fxLastRound){ fxLastRound=S.round; fxLastLen=B.log.length; return; }
  if(B.log.length<=fxLastLen){ return; }
  for(let i=fxLastLen;i<B.log.length;i++){
    const entry=B.log[i];
    if(!entry.icon) continue;
    const n = entry.c==='d1'?1:(entry.c==='d2'?2:null);
    if(!n) continue;
    const box=$('#hpFx'+n);
    if(!box) continue;
    const span=document.createElement('span');
    span.className='hpFxIcon';
    span.textContent=entry.icon;
    box.appendChild(span);
    span.addEventListener('animationend', ()=>span.remove());
    setTimeout(()=>{ if(span.parentNode) span.remove(); }, 1500);
  }
  fxLastLen=B.log.length;
}

function renderRoundEnd(st){
  const B=S.battle, w=B.winner;
  st.innerHTML=`
  <div class="panel">
    <div class="result">
      <div class="big ${w===1?'p1c':w===2?'p2c':''}">${w===0?'引き分け':esc(S.names[w])+' の勝ち'}</div>
      <p class="muted">${B.turn-1}ターンで決着 ・ 通算 ${S.wins[1]} - ${S.wins[2]}</p>
      <p class="num">獲得pt: ${esc(S.names[1])} +${w===0?Math.round((S.cfg.winPt+S.cfg.losePt)/2):(w===1?S.cfg.winPt:S.cfg.losePt)}　/　${esc(S.names[2])} +${w===0?Math.round((S.cfg.winPt+S.cfg.losePt)/2):(w===2?S.cfg.winPt:S.cfg.losePt)}</p>
    </div>
    <div class="row" style="justify-content:center">
      ${role===1?`<button class="btn" id="nextBtn">${S.round>=S.cfg.rounds?'試合結果へ':'次のラウンドへ'}</button>`:'<span class="muted">ホストが次に進めるのを待っています…</span>'}

function renderMatchEnd(st){
  const w = S.wins[1]>S.wins[2]?1:S.wins[2]>S.wins[1]?2:0;
  st.innerHTML=`<div class="panel"><div class="result">
    <p class="muted">${S.endedEarly?`${(S.history||[]).length}ラウンド終了(両者の合意により早期終了)`:`${S.cfg.rounds}ラウンド終了`}</p>

  $('#stage').innerHTML=`

      <p class="muted" style="margin-top:10px">作った人がホストになり、試合の進行を受け持ちます。ホストがページを閉じると進行が止まります。</p>

      <div class="field"><label>合言葉</label><input id="gCode" class="num" maxlength="5" placeholder="ABCDE" style="letter-spacing:.2em;text-transform:uppercase"></div>
      <button class="btn ghost" id="joinBtn">参加する</button>
    </div>
  </div>
  <div class="panel">
    <h2>数値設定 <small>部屋を作る人だけが決められます</small></h2>
    <div class="cfg">
      ${f('rounds','ラウンド数')}${f('maxTurns','1戦闘のターン上限')}
      ${f('baseHp','初期HP')}${f('startPt','初期pt')}
      ${f('baseAtk','初期攻撃力')}${f('winPt','勝利時の獲得pt')}
      ${f('baseDef','初期防御力')}${f('losePt','敗北時の獲得pt')}
      ${f('baseSpd','初期速度')}${f('ptLife','ptの有効ラウンド数')}
      ${f('rerollBase','ショップ更新の基本費用')}${f('dblThr','追撃に必要な速度倍率(0で無効)','0.1')}
      ${f('startCoin','初期コイン')}${f('coinPerRound','毎ラウンド配布されるコイン')}
      ${f('coinLife','コインの有効ラウンド数')}${f('coinTierSize','単価が上がる購入単位(ユニット)')}
      ${f('hpPerCoin','1ユニットあたりのHP')}${f('atkPerCoin','1ユニットあたりの攻撃力')}
      ${f('defPerCoin','1ユニットあたりの防御力')}${f('spdPerCoin','1ユニットあたりの速度')}
      <div class="field"><label>ダメージの計算方法</label>
        <select id="cfg_formula">
          <option value="ratio">割合式 ─ 攻×攻÷(攻+防)</option>
          <option value="sub">減算式 ─ 攻−防</option>
        </select></div>
      <div class="field"><label>ラウンドごとにスキル所持をリセット</label>
        <select id="cfg_resetEachRound"><option value="1">リセットする</option><option value="0">持ち越す</option></select></div>
      <div class="field"><label>ラウンドごとにコイン購入ステータスをリセット</label>
        <select id="cfg_resetStatsEachRound"><option value="1">リセットする</option><option value="0">持ち越す</option></select></div>
      <div class="field"><label>ロール選択(試合開始前に1度選ぶ基礎ステータス補正)</label>
        <select id="cfg_useRoles"><option value="1">行う</option><option value="0">行わない</option></select></div>
    </div>
    <p class="muted">ptはスキル購入専用、コインはステータス購入専用で、互いに流用できません。コインでの購入は買うほど単価が上がります(100ユニットごとに+1コイン/ユニット)。スキルの持ち越しとステータス購入の持ち越しは別々に設定できます。基礎値は左のここで変えられます。</p>
  </div>
  <div class="panel">
    <h2>スキルの必要pt・効果値 <small>デモ用にすべて変更できます(空欄は初期値のまま)・必要pt順</small></h2>
    <div class="shop">
      ${SKILL_IDS.slice().sort((a,b)=>SKILLS[a].cost-SKILLS[b].cost).map(k=>{
        const s=SKILLS[k];

        return `<div class="skill" style="cursor:default">

        </div>`;
      }).join('')}

  const readCfg=()=>{
    const out={...DEFAULT_CFG};
    for(const k of Object.keys(DEFAULT_CFG)){
      const el=document.getElementById('cfg_'+k); if(!el)continue;
      if(k==='formula') out[k]=el.value;
      else if(k==='resetEachRound') out[k]=el.value==='1';
      else if(k==='resetStatsEachRound') out[k]=el.value==='1';
      else if(k==='useRoles') out[k]=el.value==='1';
      else out[k]=parseFloat(el.value)||0;

    out.maxTurns=clamp(Math.round(out.maxTurns),3,200);
    out.ptLife=clamp(Math.round(out.ptLife),1,10);
    out.coinLife=clamp(Math.round(out.coinLife),1,10);
    out.coinTierSize=clamp(Math.round(out.coinTierSize)||100,1,100000);
    out.skillCosts={};
    out.skillParams={};
    for(const k of SKILL_IDS){

      out.skillCosts[k]= ce ? Math.max(0,Math.round(parseFloat(ce.value)||0)) : SKILLS[k].cost;
      const params=PARAM_DEFS[k]||[];
      if(params.length){
        out.skillParams[k]={};
        for(const p of params){
          const pe=document.getElementById(`skp_${k}_${p.key}`);
          out.skillParams[k][p.key]= pe && pe.value!=='' ? parseFloat(pe.value) : p.default;
        }
      }
    }
    return out;
  };
  $('#createBtn').onclick=()=>createRoom($('#hName').value.trim()||'プレイヤー1',readCfg());
  $('#joinBtn').onclick=()=>{
    const c=$('#gCode').value.trim();
    if(c.length<3){toast('合言葉を入力してください');return}
    joinRoom($('#gName').value.trim()||'プレイヤー2',c);
  };
}

  const cfg = (S && S.cfg) ? S.cfg : DEFAULT_CFG;
  return `

  <ul class="rules">
    <li>全${cfg.rounds}ラウンドを行い、勝利数が多い方が試合に勝つ(引き分けはどちらの勝利数にも入らない)</li>
    <li>各ラウンドの最初にショップで所持pt・コインを使ってスキルやステータスを購入し、両者が確定したら戦闘開始</li>
    <li>ラウンド勝利で+${cfg.winPt}pt、敗北で+${cfg.losePt}ptを獲得。ptは${cfg.ptLife}ラウンド後まで持ち越せる(古いptから消費)。ptはスキル購入専用</li>
    <li>コインは勝敗に関係なく毎ラウンド+${cfg.coinPerRound}配布され、${cfg.coinLife}ラウンド後まで持ち越せる。コインはステータス購入専用で、買うほど単価が上がる(${cfg.coinTierSize}ユニットごとに+1コイン/ユニット)</li>

  <h3>戦闘の処理順</h3>

    <li>ダメージは${cfg.formula==='sub'?'「攻撃力−防御力」(減算式)':'「攻撃力×攻撃力÷(攻撃力+防御力)」(割合式)'}で計算</li>
    <li>速度が相手の${cfg.dblThr}倍以上あると、その速い方がそのターンにもう一撃、追撃を行う${cfg.dblThr<=0?'(現在の設定では無効)':''}</li>
    <li>相手が所持しているスキルや進行中の効果は戦闘中も非公開。発動した瞬間だけログに現れる</li>
  </ul>
  <h3>スキップ・早期終了</h3>
  <ul class="rules">
    <li>両者が使用スキルを使い切り、通常攻撃しか選べなくなると、画面右上に「スキップ」ボタンと四角2つが現れる</li>
    <li>自分が賛成すると自分側の四角が灯る。双方賛成で両方灯ると、残りのターンが自動で処理され、その場で決着する</li>
    <li>どちらかが全${cfg.rounds}ラウンド中${Math.floor(cfg.rounds/2)+1}ラウンドを先取すると、同じ位置に「終了」ボタンが現れる</li>
    <li>双方が賛成すると、残りのラウンドを行わずにその時点で試合を終了できる(勝敗はそこまでの勝利数で決まる)</li>

function openHelp(){ $('#helpBody').innerHTML = renderHelpBody(); $('#helpOverlay').classList.remove('hidden'); }
function closeHelp(){ $('#helpOverlay').classList.add('hidden'); }

(async function boot(){
  me=clientId();
  $('#helpBtn').onclick=openHelp;
  $('#helpClose').onclick=closeHelp;
  $('#helpOverlay').onclick=(e)=>{ if(e.target.id==='helpOverlay') closeHelp(); };

  if(!window.firebase || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('YOUR_')){
    $('#stage').innerHTML=`<div class="panel"><h2>Firebaseの設定が未入力です</h2>
      <p class="muted">HTMLファイル冒頭の FIREBASE_CONFIG に、ご自身のFirebaseプロジェクトの設定値を入力してください。手順は同梱の README を参照してください。</p></div>`;
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const _rtdb = firebase.database();
    /* Realtime Databaseの ref() を、このアプリが期待する
       doc().get()/.set()/.update()/.onSnapshot() の形に合わせるための薄いアダプター */
    function rtdbDoc(path){
      const ref = _rtdb.ref(path);
      const wrap = snap => ({ exists: snap.exists(), data: ()=>snap.val() });
      return {
        async get(){ return wrap(await ref.once('value')); },
        async set(data){ return ref.set(data); },
        async update(data){ return ref.update(data); },
        onSnapshot(onNext, onError){
          const cb = ref.on('value', snap=>onNext(wrap(snap)), err=>{ if(onError) onError(err); });
          return ()=>ref.off('value', cb);
        }
      };
    }
    db = { doc: rtdbDoc };

    /* 接続状態の表示。回線が切れている/不安定なときは
       「バグで止まった」のか「単に繋がっていないだけ」なのかが
       プレイヤーから見分けられるように、右上に小さく出す */
    const dot=$('#connDot');
    _rtdb.ref('.info/connected').on('value', snap=>{
      if(!dot) return;
      const ok = snap.val()===true;
      dot.style.display='inline-block';
      dot.style.background = ok ? 'var(--ok)' : 'var(--p1)';
      dot.title = ok ? '接続中' : '接続が不安定です(通信を待っています)';
      if(!ok) toast('サーバーとの接続が不安定です。しばらくお待ちください');
    });
  }catch(e){
    $('#stage').innerHTML=`<div class="panel"><h2>Firebaseへの接続に失敗しました</h2>
      <p class="muted">${esc(e.message||String(e))}</p></div>`;
    return;
  }

  /* 想定外のJSエラーを黙って失敗させず、必ずトーストで気づけるようにする */
  window.addEventListener('error', e=>{
    console.error('unhandled error:', e.error||e.message);
    toast('予期しないエラーが発生しました: '+(e.message||e.error||''));
  });
  window.addEventListener('unhandledrejection', e=>{
    console.error('unhandled rejection:', e.reason);
    toast('予期しない通信エラーが発生しました: '+(e.reason&&e.reason.message||e.reason||''));
  });

  renderEntry();
})();
</script>
